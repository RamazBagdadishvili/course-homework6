<!Doctype HTML>
<html>
  <head>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="navigations container">
      <img src="./images/logo.svg" alt="Homely's logo" />
      <nav class="header-nav">
        <ul class="nav-list">
          <li>
            <a href="#">Home</a>
          </li>
          <li>
            <a href="#">About</a>
          </li>
          <li>
            <a href="#">Shop</a>
          </li>
          <li>
            <a href="#">Contact</a>
          </li>
        </ul>
        <div class="icons">
          <div>
            <img src="./images/cart-icon.svg" alt="cart icon" />
          </div>
          <div>
            <img src="./images/user-icon.svg" alt="user icon" />
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero container">
        <div class="product-images">
          <div class="product-gallery">
            <ul class="images-list">
              <li>
                <img src="./images/product-img-1.png" alt="Sofa" />
              </li>
              <li>
                <img src="./images/product-img-2.png" alt="Sofa" />
              </li>
              <li>
                <img src="./images/product-img-3.png" alt="Sofa" />
              </li>
              <li>
                <img src="./images/product-img-4.png" alt="Sofa" />
              </li>
              <li>
                <img src="./images/product-img-5.png" alt="Sofa" />
              </li>
            </ul>
          </div>
          <div class="main-image">
            <img src="./images/product-img.png" alt="Sofa" />
          </div>
        </div>
        <div class="product-text">
          <h1>
            Areni 57.1'' Upholstered <br />
            Loveseat
          </h1>
          <div class="rating-box">
            <img src="./images/stars.svg" alt="5 stars" />
            <p class="rating-count">3,345</p>
          </div>
          <p class="price">$549.99</p>
          <h2>Colors</h2>
          <div class="colors">
            <div class="color-1"></div>
            <div class="color-2"></div>
          </div>
          <div class="buttons">
            <div class="cart-row">
              <button class="add-to-cart">Add To Cart</button>
              <div class="favorite">
                <img src="./images/favorite-icon.svg" alt="favorite" />
              </div>
            </div>
            <button class="buy-now">Buy Now</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
